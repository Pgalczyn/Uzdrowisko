version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: uzdrowisko-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superhaslo123
      POSTGRES_DB: UzdrowiskoDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: